<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title></title>
</head>
<body> 

	<!DOCTYPE html>
<html>
<head>
	  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js">
    </script> 
    <script> 
        $(document).ready(function(){
            $(".tabledata").hide(); 
            
           $("#setinstallmentbtn").click(function(){ 
               $(".tabledata").slideToggle(1000); 
               
               
               
           })
            
            
        })
        
        
    </script>
    <script type="text/javascript"> 

    	function fess()
    	{ 
    		var tech=document.f1.training_type.value; 
               

    		if(tech=="JobOriented") 
    		{
    			document.f1.fees.value=40000; 
                        
    		} 
    		else if(tech=="Internship") 
    		{
    			document.f1.fees.value=20000; 
                       
    		} 

    	} 
        
        function setInstall()
        {
           var fees =document.f1.fees.value; 
              document.f1.in1.value=fees/4;
             document.f1.in2.value=fees/4;
            document.f1.in3.value=fees/4;
            document.f1.in4.value=fees/4;
        }


    </script>
    <style type="text/css">
    	 
        body{
            background-image: url("pics/2.png");
            background-repeat: no-repeat;
            background-size: cover;
        }
        
    	.brandname {
            padding: 10px;
          background:linear-gradient(to right, #1e3c72, #2a5298); /* Blue gradient */
          color: #f0f8ff; /* White text */
           text-align: center;
            border-bottom: 3px solid #0056b3; /* Darker border for definition */
        }
        h2 {
           color: #28a745; /* Emerald Green */
         font-weight: bold;
         text-transform: uppercase; /* Optional for emphasis */
         margin-bottom: 20px; /* Space below the heading */
          text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
        }

    	.formcontainer{
    		 width: 40%;
             padding: 20px; /* Add some padding for better spacing */
             margin-left:55%; /* Center the form */ 
             background-color: rgba(255, 255, 255, 0.1); /* White with 80% opacity */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Subtle shadow for depth */
           border-radius: 8px; /* Rounded corners */
          backdrop-filter: blur(10px); /* Adds a frosted glass effect */
          
    	}
        
        label{
             font-weight: normal;
             
        }



    </style> 
</head>
<body>
	<div class="jumbotron brandname">
   	       <h2>Edumatrix Education CRM</h2>
     </div>
     <div class="container formcontainer">
     	<form method="post" action="StudentRegisterion.jsp" name="f1"> 
     		<h3 class="text-center">Student Registration Form</h3>
               <div class="row">
                   <div class="col-sm-6">   
     		   <div class="form-group">
     		   	   <label>First Name</label>
     		   	   <input type="text" name="fname" class="form-control">
     		   </div>
                   </div>  
                   <div class="col-sm-6"> 
     		   <div class="form-group">
     		   	   <label>Last Name</label>
     		   	   <input type="text" name="lname" class="form-control">
     		   </div> 
                   </div>
              </div>

     		   <div class="form-group">
	   			<label>Branch</label>
	   			<select name="branch" class="form-control">
	   				<option disabled selected >----Select Branch -----</option>
	   				<option value="ENTC">ENTC</option>
	   				<option value="IT">IT</option>
	   				<option value="COMP">COMP</option>
	   				<option value="CIVIL">CIVIL</option>
	   				<option value="Other">Other</option>
	   			</select>
	   		</div> 

     		   <div class="form-group">
     		   	   <label>Email</label>
     		   	   <input type="text" name="email" class="form-control">
     		   </div>

     		   <div class="form-group">
     		   	   <label>Phone No</label>
     		   	   <input type="text" name="phno" class="form-control">
     		   </div>

     		   <div class="form-group">
     		   	   <label>Gender</label>
     		   	   <input type="radio" name="g" value="Male"> Male
     		   	   <input type="radio" name="g" value="Female"> Female

     		   </div>

     		   
	   <div class="form-group">
                <label>Technology</label> 
                <input type="radio" name="tech" value="Java"> Java
                <input type="radio" name="tech" value="PHP"> PHP
                <input type="radio" name="tech" value="Python"> Python
                <input type="radio" name="tech" value="Web"> Web
            </div> 

            <div class="form-group"> 
            	<label>Training Type</label>
            	<input type="radio" name="training_type" value="JobOriented" onclick="fess()"> Job Oriented
            	<input type="radio" name="training_type" value="Internship" onclick="fess()"> Internship

            </div> 

                <div class="row">  
                    <div class="col-sm-6">
                     <div class="form-group"> 
            	   
                         <input type="text" name="fees" placeholder="Total Fees" class="form-control" readonly>
                    </div> 
                 </div>
                 
                    
                    <div class="col-sm-6">
                     <div class="form-group"> 
                          
                         <button class="btn btn-info" id="setinstallmentbtn" name="setbtn" type="button" onclick="setInstall()">Click To Set Installment</button>
                    </div> 
                 </div>
              </div> 
                <div class="tabledata"> 
                    <table class="table table-bordered">
                        <tr class="text-center"> 
                            <th class="text-center">Date</th>
                            <th class="text-center">Installment</th>
                            <th class="text-center">Status</th> 
                        </tr>
                        <tr> 
                            <td><input type="date" name="d1" class="form-control" value="2025-01-01"></td> 
                            <td><input type="text" placeholder="install-1" name="in1" class="form-control" value="0"></td> 
                            <td>
                                <select name="status" class="form-control">
                                    <option selected  value="unPaid">UnPaid</option>
                                    <option value="Paid">Paid</option>

                                </select>
                            </td>
                            
                            
                        </tr>
                        
                        <tr> 
                            <td><input type="date" name="d2" class="form-control" value="2025-01-01" ></td> 
                            <td><input type="text" placeholder="install-2" name="in2" class="form-control" value="0"></td> 
                            <td>
                                <select name="status2" class="form-control">
                                    <option selected  value="unPaid">UnPaid</option>
                                    <option value="Paid">Paid</option>

                                </select>
                            </td>
                            
                            
                        </tr>
                        
                        <tr> 
                            <td><input type="date" name="d3" class="form-control" value="2025-01-01"></td> 
                            <td><input type="text" placeholder="install-3" name="in3" class="form-control" value="0"></td> 
                            <td>
                                <select name="status3" class="form-control">
                                    <option selected  value="unPaid">UnPaid</option>
                                    <option value="Paid">Paid</option>

                                </select>
                            </td>
                            
                            
                        </tr> 
                        
                        <tr> 
                            <td><input type="date" name="d4" class="form-control" value="2025-01-01"></td> 
                            <td><input type="text" placeholder="install-4" name="in4" class="form-control" value="0"></td> 
                            <td>
                                <select name="status4" class="form-control">
                                    <option selected  value="unPaid">UnPaid</option>
                                    <option value="Paid">Paid</option>

                                </select>
                            </td>
                            
                            
                        </tr>
                        
                    </table>
                    
                    
                    
                </div>


     		   <div class="form-group">
     		   	   <button class="btn btn-info" type="submit">Registered</button>
     		   	   <button class="btn btn-danger" type="reset">Reset</button>
     		   </div>
     	
  


     	</form>


     </div>

</body>
</html>

</body>
</html>
